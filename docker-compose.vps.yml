services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vshield-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment or .env.vps file}"
    expose:
      - "1433"
    volumes:
      - vshield_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment or .env.vps file}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./API/API
      dockerfile: Dockerfile
    container_name: vshield-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5107"
      ASPNETCORE_HTTP_PORTS: "5107"
      RateLimits__AuthPermitLimit: "500"
      RateLimits__AuthWindowSeconds: "60"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${SQL_DATABASE:-AccessControlDB};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment or .env.vps file};Encrypt=True;TrustServerCertificate=True;"
      VSHIELD_JWT_SECRET: "${VSHIELD_JWT_SECRET:?Set VSHIELD_JWT_SECRET in your environment or .env.vps file}"
      JwtSettings__Issuer: "${JWT_ISSUER:-VShieldAPI-VPS}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-VShieldClient-VPS}"
      VSHIELD_SEED_ADMIN_USERNAME: "${VSHIELD_SEED_ADMIN_USERNAME:?Set VSHIELD_SEED_ADMIN_USERNAME in your environment or .env.vps file}"
      VSHIELD_SEED_ADMIN_PASSWORD: "${VSHIELD_SEED_ADMIN_PASSWORD:?Set VSHIELD_SEED_ADMIN_PASSWORD in your environment or .env.vps file}"
      VSHIELD_EVIDENCE_EXPORT_SIGNING_KEY: "${VSHIELD_EVIDENCE_EXPORT_SIGNING_KEY:?Set VSHIELD_EVIDENCE_EXPORT_SIGNING_KEY in your environment or .env.vps file}"
      Authentication__RequireMfaForRoles__0: "Admin"
      Authentication__RequireMfaForRoles__1: "BaoVe"
      Authentication__DemoBypassMfa: "${AUTH_DEMO_BYPASS_MFA:-false}"
      RateLimiting__Backend: "SqlServer"
      Runtime__Mode: docker
      DemoData__Enabled: "${DEMO_DATA_ENABLED:-true}"
      DemoData__AllowInProduction: "${DEMO_DATA_ALLOW_IN_PRODUCTION:-false}"
      Security__EnableHttpsRedirection: "${SECURITY_ENABLE_HTTPS_REDIRECTION:-false}"
      Security__GatewayHeadersManagedByProxy: "${SECURITY_GATEWAY_HEADERS_MANAGED_BY_PROXY:-true}"
      DataProtection__KeyRingPath: "/var/app/data-protection"
      AppSettings__FrontendUrl: "${APP_FRONTEND_URL:?Set APP_FRONTEND_URL in your environment or .env.vps file}"
      AppSettings__AllowedOrigins__0: "${APP_FRONTEND_URL:?Set APP_FRONTEND_URL in your environment or .env.vps file}"
      AppSettings__AllowedOrigins__1: "${APP_FRONTEND_URL_ALT:-}"
      AppSettings__AllowedOrigins__2: ""
      AppSettings__Go2RtcPublicBaseUrl: "${APP_FRONTEND_URL:?Set APP_FRONTEND_URL in your environment or .env.vps file}"
      Cloudflared__PublicHostname: "${APP_PUBLIC_HOSTNAME:-160.250.4.187}"
      AiServices__FaceCameraBaseUrl: "${FACE_SERVICE_URL:-http://face-runtime:5001/api}"
      FaceStorage__InputRoot: "/app/wwwroot/uploads/VideoFace"
      Sync__Mode: "${SYNC_MODE:-Central}"
      Sync__RegistrationKey: "${SYNC_REGISTRATION_KEY:?Set SYNC_REGISTRATION_KEY in your environment or .env.vps file}"
      Sync__Version: "${SYNC_VERSION:-2.0.0}"
      Sync__PushIntervalSeconds: "${SYNC_PUSH_INTERVAL_SECONDS:-2}"
      Sync__PullIntervalSeconds: "${SYNC_PULL_INTERVAL_SECONDS:-3}"
      Sync__BatchSize: "${SYNC_BATCH_SIZE:-100}"
      Sync__DownstreamScanMultiplier: "${SYNC_DOWNSTREAM_SCAN_MULTIPLIER:-20}"
      VSHIELD_AI_PROVIDER: "${VSHIELD_AI_PROVIDER:-Disabled}"
      VSHIELD_AI_ENDPOINT: "${VSHIELD_AI_ENDPOINT:-https://api.deepseek.com/chat/completions}"
      VSHIELD_AI_API_KEY: "${VSHIELD_AI_API_KEY:-}"
      AiProvider__Model: "${VSHIELD_AI_MODEL:-deepseek-v4-flash}"
      VSHIELD_EMAIL_MODEL: "${VSHIELD_EMAIL_MODEL:-deepseek-v4-pro}"
      Mail__Host: "${MAIL_HOST:-}"
      Mail__Port: "${MAIL_PORT:-587}"
      Mail__User: "${MAIL_USER:-}"
      Mail__Password: "${MAIL_PASSWORD:-}"
      Mail__From: "${MAIL_FROM:-no-reply@${MAIL_DOMAIN:-}}"
      Mail__FromName: "${MAIL_FROM_NAME:-V-Shield}"
      Mail__EnableSsl: "${MAIL_ENABLE_SSL:-true}"
      Mail__AllowExternal: "${MAIL_ALLOW_EXTERNAL:-false}"
      Mail__Domain: "${MAIL_DOMAIN:-}"
      Mail__CompanyName: "${MAIL_COMPANY_NAME:-V-Shield}"
      Mail__LogoUrl: "${MAIL_LOGO_URL:-}"
      MAIL_LOG_PATH: "${MAIL_LOG_PATH:-/var/mailu-logs/log/s6/haraka-outbound}"
    expose:
      - "5107"
    volumes:
      - vshield_data_protection:/var/app/data-protection
      - vshield_mailu_data:/var/mailu-logs:ro
      - ./runtime/face-data/input:/app/wwwroot/uploads/VideoFace
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5107/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - default
      - face-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./View
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
        VITE_QR_API_BASE_URL: "${VITE_QR_API_BASE_URL:-/api}"
        VITE_PLATE_API_BASE_URL: "${VITE_PLATE_API_BASE_URL:-/api}"
    container_name: vshield-frontend
    environment:
      API_PROXY_BASE: "http://api:5107"
      QR_PROXY_BASE: "http://api:5107"
      PLATE_PROXY_BASE: "http://api:5107"
      GO2RTC_PROXY_BASE: "http://api:5107"
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  face-runtime:
    build:
      context: ./AI_Runtime/face_recognition
      dockerfile: Dockerfile
    container_name: vshield-face-runtime
    command: ["sh", "-lc", "cd /workspace/V-Shield/AI_Runtime/face_recognition && python3 nhandienface.py"]
    environment:
      PORT: 5001
      FACE_MODEL_DIR: "${FACE_MODEL_DIR:-/data/face/models/active}"
      FACE_ENROLLMENT_INPUT_ROOT: /data/face/input
      FACE_MODEL_STAGING_DIR: /data/face/models/staging
      FACE_MODEL_ARCHIVE_DIR: /data/face/models/archive
      FACE_MODEL_FAILED_DIR: /data/face/models/failed
    volumes:
      - ./:/workspace/V-Shield
      - ./runtime/face-data/input:/data/face/input:ro
      - ./runtime/face-data/models:/data/face/models
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - face-backend
    restart: unless-stopped
    profiles: ["ai-heavy"]

volumes:
  vshield_mssql_data:
  vshield_data_protection:
  vshield_mailu_data:
    external: true

networks:
  face-backend:
    name: vshield-face-backend
    driver: bridge
