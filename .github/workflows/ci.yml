name: V-Shield CI (API / Python / Android)

on:
  pull_request:
    paths:
      - 'API/**'
      - 'AI_Runtime/**'
      - 'scripts/**'
      - 'V-Shield-Mobile/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.coveragerc'
      - '.github/workflows/ci.yml'
  push:
    branches: ['release/**']
    paths:
      - 'API/**'
      - 'AI_Runtime/**'
      - 'scripts/**'
      - 'V-Shield-Mobile/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.coveragerc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore API/API/API.slnx
      - name: Test (coverage gate enforced via coverlet.msbuild)
        run: dotnet test API/API/API.slnx --no-restore --configuration Release
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.run_id }}
          path: API/API/API.Tests/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run pytest with coverage gate
        run: pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.run_id }}
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant gradlew permission
        run: chmod +x gradlew
        working-directory: V-Shield-Mobile
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: V-Shield-Mobile
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ github.run_id }}
          path: V-Shield-Mobile/app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
