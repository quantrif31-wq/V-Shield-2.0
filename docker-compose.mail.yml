# ============================================================
#  MAIL SERVER TỰ HOST - Poste.io (1 container: SMTP+IMAP+Webmail+Admin)
#  Dùng cho production VPS (self-hosted company mail).
#
#  CÁCH DÙNG (cấu hình 1 lần trên VPS):
#   1. DNS (bạn phải thêm tại nhà cung cấp DNS domain):
#        - A        mail.<domain> -> IP VPS
#        - MX       <domain>      -> mail.<domain> (prio 10)
#        - SPF      TXT v=spf1 a mx ip4:<IP> ~all
#        - DMARC    TXT _dmarc.<domain> v=DMARC1; p=none
#        - DKIM     key sinh trong admin :8080 (bảng Virtual domains -> dkim)
#        - PTR      reverse IP -> mail.<domain> (đặt tại nhà cung cấp VPS)
#   2. docker compose -f docker-compose.mail.yml --env-file .env.mail up -d
#   3. Admin/webmail: http://<IP>:8080  (đăng nhập admin@domain / POSTE_ADMIN_PASS)
#   4. Sửa .env.vps: MAIL_HOST=mailu, MAIL_PORT=587,
#      MAIL_USER=admin@<domain>, MAIL_PASSWORD=<POSTE_ADMIN_PASS>,
#      MAIL_ENABLE_SSL=false (STARTTLS) -> docker compose up -d api
#
#  LƯU Ý: để mail tới Gmail/Outlook vào Inbox cần đủ SPF/DKIM/DMARC/PTR +
#  IP sạch; VPS cloud thường bị đánh giá thấp -> có thể vào Spam vài tuần đầu.
# ============================================================

services:
  mailu:
    image: analogic/poste.io:latest
    container_name: vshield-mailu
    restart: unless-stopped
    hostname: mail.${MAIL_DOMAIN:-v-shield.site}
    networks:
      - default
    environment:
      HOSTNAME: mail.${MAIL_DOMAIN:-v-shield.site}
      POSTE_ADMIN_USER: "${MAILU_ADMIN_USER:-admin@${MAIL_DOMAIN:-v-shield.site}}"
      POSTE_ADMIN_PASS: "${MAILU_ADMIN_PASSWORD:-AdminMail@2026}"
      DISABLE_CLAMAV: "false"
    ports:
      - "25:25"
      - "110:110"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "${MAIL_WEB_PORT:-18080}:80"      # admin + webmail (tránh xung đột frontend 8080)
      - "${MAIL_HTTPS_PORT:-18443}:443"
    volumes:
      - mailu_data:/data

volumes:
  mailu_data:

networks:
  default:
    name: ${MAIL_NETWORK:-v-shield-20_default}
    external: true
