services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vshield-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - vshield_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./API/API
      dockerfile: Dockerfile
    container_name: vshield-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5107
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AccessControlDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False;"
      Runtime__Mode: docker
      AppSettings__FrontendUrl: "${APP_FRONTEND_URL:-http://localhost:5173}"
      AppSettings__AllowedOrigins__0: "${APP_FRONTEND_URL:-http://localhost:5173}"
      AiServices__PlateBaseUrl: "${PLATE_SERVICE_URL:-http://plate-runtime:5002/api}"
      AiServices__FaceCameraBaseUrl: "${FACE_SERVICE_URL:-http://face-runtime:5001/api}"
      AiServices__FaceIdBaseUrl: "${FACEID_SERVICE_URL:-http://faceid-runtime:8000}"
    ports:
      - "5107:5107"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5107/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./View
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:5107/api}"
        VITE_QR_API_BASE_URL: "${VITE_QR_API_BASE_URL:-http://localhost:8001}"
        VITE_PLATE_API_BASE_URL: "${VITE_PLATE_API_BASE_URL:-http://localhost:5002/api}"
        VITE_FACE_API_BASE_URL: "${VITE_FACE_API_BASE_URL:-http://localhost:5001/api}"
    container_name: vshield-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  qr-runtime:
    build:
      context: ./AI_Runtime/QR_Dong
      dockerfile: Dockerfile
    container_name: vshield-qr-runtime
    ports:
      - "8001:8001"
    restart: unless-stopped
    profiles: ["ai"]

  plate-runtime:
    build:
      context: ./AI_Runtime/doc_bien_gpu
      dockerfile: Dockerfile
    container_name: vshield-plate-runtime
    environment:
      PORT: 5002
    ports:
      - "5002:5002"
    restart: unless-stopped
    profiles: ["ai-heavy"]

volumes:
  vshield_mssql_data:
