services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vshield-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-VshieldSqlLocal@2026}"
    ports:
      - "1433:1433"
    volumes:
      - vshield_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-VshieldSqlLocal@2026}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./API/API
      dockerfile: Dockerfile
    container_name: vshield-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "5107"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AccessControlDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-VshieldSqlLocal@2026};Encrypt=True;TrustServerCertificate=True;"
      VSHIELD_JWT_SECRET: "${VSHIELD_JWT_SECRET:-VshieldLocalJwtSecretKey_2026_ChangeMe123}"
      VSHIELD_SEED_ADMIN_USERNAME: "${VSHIELD_SEED_ADMIN_USERNAME:-admin}"
      VSHIELD_SEED_ADMIN_PASSWORD: "${VSHIELD_SEED_ADMIN_PASSWORD:-AdminLocal@2026}"
      DemoData__Enabled: "${DEMO_DATA_ENABLED:-true}"
      Runtime__Mode: docker
      Security__EnableHttpsRedirection: "false"
      DataProtection__KeyRingPath: "/var/app/data-protection"
      AppSettings__FrontendUrl: "${APP_FRONTEND_URL:-}"
      AppSettings__Go2RtcPublicBaseUrl: "${APP_GO2RTC_PUBLIC_BASE_URL:-}"
      AppSettings__AllowCrossOriginGo2RtcFrame: "${APP_ALLOW_CROSS_ORIGIN_GO2RTC_FRAME:-false}"
      AppSettings__AllowedOrigins__0: "http://localhost:5173"
      AppSettings__AllowedOrigins__1: "http://127.0.0.1:5173"
      AppSettings__AllowedOrigins__2: "http://localhost:5174"
      AppSettings__AllowedOrigins__3: "http://localhost:5175"
      AppSettings__AllowedOrigins__4: "${APP_FRONTEND_URL:-}"
      Go2Rtc__ConfigPath: "${GO2RTC_CONFIG_PATH:-/runtime/go2rtc/go2rtc.yaml}"
      Go2Rtc__ReloadUrl: "${GO2RTC_RELOAD_URL:-http://go2rtc:1984/api/restart}"
      Go2Rtc__WebRtcCandidates: "${GO2RTC_WEBRTC_CANDIDATES:-}"
      Go2Rtc__WebRtcPort: "${GO2RTC_WEBRTC_PORT:-8555}"
      Go2Rtc__StreamMode: "${GO2RTC_STREAM_MODE:-webrtc}"
      AiServices__PlateBaseUrl: "${PLATE_SERVICE_URL:-http://plate-runtime:5002/api}"
      AiServices__FaceCameraBaseUrl: "${FACE_SERVICE_URL:-http://face-runtime:5001/api}"
      Authentication__DemoBypassMfa: "${AUTH_DEMO_BYPASS_MFA:-false}"
      FaceStorage__InputRoot: "/app/wwwroot/uploads/VideoFace"
      Sync__Mode: "${SYNC_MODE:-Standalone}"
      Sync__CentralBaseUrl: "${SYNC_CENTRAL_BASE_URL:-}"
      Sync__RegistrationKey: "${SYNC_REGISTRATION_KEY:-}"
      Sync__LocalAreaNodeId: "${SYNC_LOCAL_AREA_NODE_ID:-}"
      Sync__CompanyId: "${SYNC_COMPANY_ID:-}"
      Sync__SiteId: "${SYNC_SITE_ID:-}"
      Sync__DisplayName: "${SYNC_DISPLAY_NAME:-}"
      Sync__Version: "${SYNC_VERSION:-2.0.0}"
      Sync__AssignedGateIds: "${SYNC_ASSIGNED_GATE_IDS:-}"
      Sync__AssignedLaneIds: "${SYNC_ASSIGNED_LANE_IDS:-}"
      Sync__AssignedZoneIds: "${SYNC_ASSIGNED_ZONE_IDS:-}"
      Sync__PushIntervalSeconds: "${SYNC_PUSH_INTERVAL_SECONDS:-2}"
      Sync__PullIntervalSeconds: "${SYNC_PULL_INTERVAL_SECONDS:-3}"
      Sync__BatchSize: "${SYNC_BATCH_SIZE:-50}"
    ports:
      - "5107:5107"
    depends_on:
      db:
        condition: service_healthy
      go2rtc:
        condition: service_started
    volumes:
      - vshield_data_protection:/var/app/data-protection
      - ./runtime/go2rtc:/runtime/go2rtc
      - ./runtime/uploads:/app/wwwroot/uploads
      - ./runtime/face-data/input:/app/wwwroot/uploads/VideoFace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5107/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - default
      - face-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./View
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
        VITE_QR_API_BASE_URL: "${VITE_QR_API_BASE_URL:-/qr-api}"
        VITE_QR_API_BASE_URL_LANE2: "${VITE_QR_API_BASE_URL_LANE2:-/qr-api-lane2}"
        VITE_PLATE_API_BASE_URL: "${VITE_PLATE_API_BASE_URL:-/plate-api/api}"
    container_name: vshield-frontend
    environment:
      API_PROXY_BASE: "${API_PROXY_BASE:-http://api:5107}"
      QR_PROXY_BASE: "${QR_PROXY_BASE:-http://qr-runtime:8001}"
      QR_PROXY_BASE_LANE2: "${QR_PROXY_BASE_LANE2:-http://qr-runtime-lane2:8001}"
      PLATE_PROXY_BASE: "${PLATE_PROXY_BASE:-http://plate-runtime:5002}"
      GO2RTC_PROXY_BASE: "${GO2RTC_PROXY_BASE:-http://go2rtc:1984}"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
      go2rtc:
        condition: service_started
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: vshield-go2rtc
    command: ["go2rtc", "-config", "/config/go2rtc.yaml"]
    volumes:
      - ./runtime/go2rtc:/config
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vshield-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
    profiles: ["tunnel"]

  qr-runtime:
    build:
      context: ./AI_Runtime/QR_Dong
      dockerfile: Dockerfile
    container_name: vshield-qr-runtime
    ports:
      - "8001:8001"
    restart: unless-stopped
    profiles: ["ai"]

  qr-runtime-lane2:
    build:
      context: ./AI_Runtime/QR_Dong
      dockerfile: Dockerfile
    container_name: vshield-qr-runtime-lane2
    ports:
      - "8002:8001"
    restart: unless-stopped
    profiles: ["ai"]

  plate-runtime:
    build:
      context: ./AI_Runtime/doc_bien_gpu
      dockerfile: Dockerfile
    container_name: vshield-plate-runtime
    environment:
      PORT: 5002
    ports:
      - "5002:5002"
    restart: unless-stopped
    profiles: ["ai-heavy"]

  face-runtime:
    build:
      context: ./AI_Runtime/face_recognition
      dockerfile: Dockerfile
    container_name: vshield-face-runtime
    command: ["sh", "-lc", "cd /workspace/V-Shield/AI_Runtime/face_recognition && python3 nhandienface.py"]
    environment:
      PORT: 5001
      FACE_MODEL_DIR: "${FACE_MODEL_DIR:-/data/face/models/active}"
      FACE_ENROLLMENT_INPUT_ROOT: /data/face/input
      FACE_MODEL_STAGING_DIR: /data/face/models/staging
      FACE_MODEL_ARCHIVE_DIR: /data/face/models/archive
      FACE_MODEL_FAILED_DIR: /data/face/models/failed
      FACE_DETECTOR_MODEL: /data/face-models/face_detection_yunet_2023mar.onnx
      FACE_EMBEDDER_MODEL: /data/face-models/face_recognition_sface_2021dec.onnx
      FACE_LANDMARKER_MODEL: /data/face-models/face_landmarker.task
      FACE_PREFER_GPU: "true"
      FACE_GPU_DEVICE_ID: "0"
      FACE_THRESHOLD: "${FACE_THRESHOLD:-0.35}"
    volumes:
      - ./:/workspace/V-Shield
      - ./runtime/face-data/input:/data/face/input:ro
      - ./runtime/face-data/models:/data/face/models
      - ./runtime/face-models:/data/face-models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - face-backend
    restart: unless-stopped
    profiles: ["ai-heavy"]

volumes:
  vshield_mssql_data:
  vshield_data_protection:

networks:
  face-backend:
    name: vshield-face-backend
    driver: bridge
